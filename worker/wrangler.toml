name = "currentnews-worker"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

routes = [
  { pattern = "api.currentnews.blog", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "currentnews-db"
database_id = "b19ce705-bbfd-4cf1-9721-498013cadc63"

[[durable_objects.bindings]]
name = "AGG"
class_name = "StatsAggregator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StatsAggregator"]

[vars]
FIREBASE_PROJECT_ID = "gen-lang-client-0638643565"